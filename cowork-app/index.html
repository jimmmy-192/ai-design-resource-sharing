<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>设计资源精选</title>
    <link rel="stylesheet" href="./styles.css?v=47" />
  </head>
  <body>
    <main class="app-shell" aria-live="polite">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="issueLabel">2026-W30 / 7.15-7.22</p>
          <h1 id="pageTitle">本期精选</h1>
        </div>
        <div class="view-controls is-hidden" id="viewControls">
          <div class="issue-filter" id="issueFilter">
            <button
              class="issue-filter-button"
              id="issueFilterButton"
              type="button"
              aria-haspopup="listbox"
              aria-expanded="false"
            >
              <span id="issueFilterValue">全部</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m7 10 5 5 5-5"></path>
              </svg>
            </button>
            <div class="issue-menu" id="issueMenu" role="listbox" aria-label="选择期次"></div>
          </div>
          <button
            class="layout-toggle"
            id="layoutToggle"
            type="button"
            aria-label="切换为瀑布流排列"
            aria-pressed="false"
            title="切换为瀑布流排列"
          >
            <svg class="layout-icon layout-icon-masonry" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="3" width="7" height="8" rx="1.5"></rect>
              <rect x="14" y="3" width="7" height="5" rx="1.5"></rect>
              <rect x="3" y="15" width="7" height="6" rx="1.5"></rect>
              <rect x="14" y="12" width="7" height="9" rx="1.5"></rect>
            </svg>
            <svg class="layout-icon layout-icon-stack" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m12 3 9 5-9 5-9-5 9-5Z"></path>
              <path d="m3 12 9 5 9-5"></path>
              <path d="m3 16 9 5 9-5"></path>
            </svg>
          </button>
        </div>
      </header>

      <section
        class="resource-filters is-hidden"
        id="allFilterPanel"
        aria-label="筛选所有案例"
      ></section>

      <section class="stage" aria-label="资源案例">
        <div class="carousel" id="carousel"></div>
        <div class="comment-pin-layer" id="commentPinLayer" aria-live="polite"></div>
        <button
          class="comment-placement-surface"
          id="commentPlacementSurface"
          type="button"
          aria-label="点击此处放置评论"
          hidden
        ></button>
        <div class="comment-placement-hint" id="commentPlacementHint" hidden>
          <strong id="commentPlacementHintText">点击内容区外任意位置放置评论</strong>
          <span>Esc 退出</span>
        </div>
        <form class="comment-point-composer" id="commentPointForm" hidden>
          <header class="comment-point-author">
            <div class="comment-point-avatar" id="commentPointAvatar" aria-hidden="true"></div>
            <div>
              <span>正在评论</span>
              <strong id="commentPointName"></strong>
            </div>
            <button id="commentPointCancel" type="button" aria-label="取消评论">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m6 6 12 12M18 6 6 18"></path>
              </svg>
            </button>
          </header>
          <label class="sr-only" for="commentPointInput">发表对这个案例的看法</label>
          <textarea
            id="commentPointInput"
            maxlength="1000"
            rows="3"
            placeholder="写下你对这个案例的看法"
          ></textarea>
          <div class="comment-point-actions">
            <span>评论会关联到这个案例</span>
            <button id="commentPointSubmit" type="submit">发布</button>
          </div>
        </form>
        <button class="comment-button featured-comment-button" id="featuredCommentButton" type="button" aria-label="放置评论" aria-expanded="false" aria-pressed="false">
          <span class="comment-button-copy">
            <span class="comment-icon-wrap">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z"></path>
              </svg>
              <span class="comment-count" hidden>0</span>
            </span>
            <span>评论</span>
          </span>
          <span class="comment-button-hint">点击后放置评论</span>
        </button>
      </section>

      <section class="profile-view is-hidden" id="profileView" aria-label="我的资源库">
        <header class="profile-identity">
          <div class="profile-identity-avatar" id="profileIdentityAvatar" aria-hidden="true">
            <span class="avatar-initials"></span>
          </div>
          <div>
            <p>我的资源库</p>
            <h2 id="profileName">正在识别成员信息</h2>
            <span id="profileEmail"></span>
          </div>
        </header>

        <div class="profile-tabs" role="tablist" aria-label="我的内容">
          <button class="profile-tab is-active" type="button" role="tab" aria-selected="true" data-profile-tab="published">
            我的发布
            <span id="publishedCount">0</span>
          </button>
          <button class="profile-tab" type="button" role="tab" aria-selected="false" data-profile-tab="favorites">
            我的收藏
            <span id="favoritesCount">0</span>
          </button>
        </div>

        <section
          class="resource-filters profile-filter-panel is-hidden"
          id="profileFilterPanel"
          aria-label="筛选我的资源"
        ></section>

        <div class="profile-content" id="profileContent"></div>
      </section>

      <div class="bottom-dock">
        <nav class="mode-tabs" aria-label="页面切换">
          <button class="tab-button is-active" type="button" data-mode="featured">本期精选</button>
          <button class="tab-button" type="button" data-mode="all">所有案例</button>
        </nav>
        <button class="profile-button" id="profileButton" type="button" aria-label="进入我的页面" title="我的">
          <span class="profile-avatar-placeholder" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M20 21a8 8 0 0 0-16 0"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>
          <img id="profileAvatar" alt="" hidden />
          <span class="profile-avatar-initials" id="profileAvatarInitials" aria-hidden="true"></span>
        </button>
      </div>

      <div class="resource-detail-layer" id="resourceDetailLayer" aria-hidden="true">
        <button
          class="resource-detail-backdrop"
          id="resourceDetailBackdrop"
          type="button"
          aria-label="关闭案例详情"
        ></button>
        <article
          class="resource-detail-dialog"
          role="dialog"
          aria-modal="true"
          aria-labelledby="resourceDetailTitle"
        >
          <button
            class="resource-detail-close"
            id="resourceDetailClose"
            type="button"
            aria-label="关闭案例详情"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m6 6 12 12M18 6 6 18"></path>
            </svg>
          </button>

          <div class="resource-detail-media">
            <img id="resourceDetailImage" alt="" />
            <span id="resourceDetailVisualLabel"></span>
          </div>

          <div class="resource-detail-content">
            <div class="resource-detail-meta">
              <div id="resourceDetailCategory"></div>
              <strong id="resourceDetailScore"></strong>
            </div>
            <h2 id="resourceDetailTitle"></h2>
            <p class="resource-detail-summary" id="resourceDetailSummary"></p>

            <section class="resource-detail-section">
              <h3>案例解读</h3>
              <p id="resourceDetailDescription"></p>
            </section>

            <section class="resource-detail-section resource-detail-usage">
              <h3>可以怎么用</h3>
              <p id="resourceDetailAction"></p>
            </section>

            <a
              class="resource-detail-external"
              id="resourceDetailExternal"
              target="_blank"
              rel="noreferrer"
            >
              <span>访问原网站</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 17 17 7M8 7h9v9"></path>
              </svg>
            </a>
          </div>
        </article>
      </div>

      <div class="publication-layer" id="publicationLayer" aria-hidden="true">
        <button
          class="publication-backdrop"
          id="publicationBackdrop"
          type="button"
          aria-label="关闭发布窗口"
        ></button>
        <section
          class="publication-dialog"
          role="dialog"
          aria-modal="true"
          aria-labelledby="publicationTitle"
        >
          <header class="publication-header">
            <div>
              <p>我的发布</p>
              <h2 id="publicationTitle">添加设计资源</h2>
            </div>
            <button
              class="publication-close"
              id="publicationClose"
              type="button"
              aria-label="关闭发布窗口"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m6 6 12 12M18 6 6 18"></path>
              </svg>
            </button>
          </header>

          <form class="publication-form" id="publicationForm">
            <fieldset>
              <legend>选择分类 <span>*</span></legend>
              <div class="publication-categories" id="publicationCategories"></div>
            </fieldset>

            <label class="publication-field">
              <span>资源链接 <strong>*</strong></span>
              <input
                id="publicationUrl"
                name="url"
                type="url"
                inputmode="url"
                autocomplete="url"
                placeholder="https://"
                required
              />
            </label>

            <label class="publication-field">
              <span>案例解读 <small>选填，留空由 AI 生成</small></span>
              <textarea
                id="publicationDescription"
                name="description"
                rows="4"
                maxlength="1200"
                placeholder="它是什么，哪些地方值得观察"
              ></textarea>
            </label>

            <label class="publication-field">
              <span>可以怎么用 <small>选填，留空由 AI 生成</small></span>
              <textarea
                id="publicationAction"
                name="action"
                rows="3"
                maxlength="800"
                placeholder="适合放进什么设计任务或工作流"
              ></textarea>
            </label>

            <p class="publication-form-message" id="publicationFormMessage" role="status"></p>

            <footer class="publication-actions">
              <button id="publicationCancel" type="button">取消</button>
              <button class="publication-submit" id="publicationSubmit" type="submit">
                确定并生成
              </button>
            </footer>
          </form>
        </section>
      </div>

      <div class="comment-layer" id="commentLayer" aria-hidden="true">
        <aside
          class="comment-popover"
          id="commentPopover"
          role="dialog"
          aria-modal="false"
          aria-labelledby="commentDrawerTitle"
        >
          <header class="comment-drawer-header">
            <div>
              <p id="commentResourceLabel">案例讨论</p>
              <h2 id="commentDrawerTitle">评论</h2>
            </div>
            <button class="comment-close" id="commentClose" type="button" aria-label="关闭评论">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m6 6 12 12M18 6 6 18"></path>
              </svg>
            </button>
          </header>

          <div class="comment-list" id="commentList" aria-live="polite"></div>

          <form class="comment-composer" id="commentForm">
            <div class="replying-to is-hidden" id="replyingTo">
              <span id="replyingToText"></span>
              <button id="cancelReply" type="button">取消</button>
            </div>
            <label class="sr-only" for="commentInput">发表评论</label>
            <textarea id="commentInput" maxlength="1000" rows="3" placeholder="写下你对这个案例的看法"></textarea>
            <div class="comment-form-actions">
              <span>最多 1000 字</span>
              <button class="comment-submit" id="commentSubmit" type="submit">发布评论</button>
            </div>
          </form>
        </aside>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="./app.js?v=29"></script>
  </body>
</html>
