<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>设计资源精选</title>
    <link rel="stylesheet" href="./styles.css?v=21" />
  </head>
  <body>
    <main class="app-shell" aria-live="polite">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="issueLabel">2026-W30 / 7.15-7.22</p>
          <h1 id="pageTitle">本期精选</h1>
        </div>
        <div class="view-controls is-hidden" id="viewControls">
          <div class="issue-filter" id="issueFilter">
            <button
              class="issue-filter-button"
              id="issueFilterButton"
              type="button"
              aria-haspopup="listbox"
              aria-expanded="false"
            >
              <span id="issueFilterValue">全部</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m7 10 5 5 5-5"></path>
              </svg>
            </button>
            <div class="issue-menu" id="issueMenu" role="listbox" aria-label="选择期次"></div>
          </div>
          <button
            class="layout-toggle"
            id="layoutToggle"
            type="button"
            aria-label="切换为瀑布流排列"
            aria-pressed="false"
            title="切换为瀑布流排列"
          >
            <svg class="layout-icon layout-icon-masonry" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="3" width="7" height="8" rx="1.5"></rect>
              <rect x="14" y="3" width="7" height="5" rx="1.5"></rect>
              <rect x="3" y="15" width="7" height="6" rx="1.5"></rect>
              <rect x="14" y="12" width="7" height="9" rx="1.5"></rect>
            </svg>
            <svg class="layout-icon layout-icon-stack" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m12 3 9 5-9 5-9-5 9-5Z"></path>
              <path d="m3 12 9 5 9-5"></path>
              <path d="m3 16 9 5 9-5"></path>
            </svg>
          </button>
        </div>
      </header>

      <section class="stage" aria-label="资源案例">
        <div class="carousel" id="carousel"></div>
      </section>

      <section class="profile-view is-hidden" id="profileView" aria-label="我的资源库">
        <header class="profile-identity">
          <div class="profile-identity-avatar" id="profileIdentityAvatar" aria-hidden="true">
            <span class="avatar-initials"></span>
          </div>
          <div>
            <p>我的资源库</p>
            <h2 id="profileName">正在识别成员信息</h2>
            <span id="profileEmail"></span>
          </div>
        </header>

        <div class="profile-tabs" role="tablist" aria-label="我的内容">
          <button class="profile-tab is-active" type="button" role="tab" aria-selected="true" data-profile-tab="published">
            我的发布
            <span id="publishedCount">0</span>
          </button>
          <button class="profile-tab" type="button" role="tab" aria-selected="false" data-profile-tab="favorites">
            我的收藏
            <span id="favoritesCount">0</span>
          </button>
        </div>

        <div class="profile-content" id="profileContent"></div>
      </section>

      <div class="bottom-dock">
        <nav class="mode-tabs" aria-label="页面切换">
          <button class="tab-button is-active" type="button" data-mode="featured">本期精选</button>
          <button class="tab-button" type="button" data-mode="all">所有案例</button>
        </nav>
        <button class="profile-button" id="profileButton" type="button" aria-label="进入我的页面" title="我的">
          <span class="profile-avatar-placeholder" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M20 21a8 8 0 0 0-16 0"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>
          <img id="profileAvatar" alt="" hidden />
          <span class="profile-avatar-initials" id="profileAvatarInitials" aria-hidden="true"></span>
        </button>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="./app.js?v=10"></script>
  </body>
</html>
