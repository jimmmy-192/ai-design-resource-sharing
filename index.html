<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>设计资源精选</title>
    <link rel="stylesheet" href="./styles.css?v=19" />
  </head>
  <body>
    <main class="app-shell" aria-live="polite">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="issueLabel">2026-W30 / 7.15-7.22</p>
          <h1 id="pageTitle">本期精选</h1>
        </div>
        <div class="view-controls is-hidden" id="viewControls">
          <label class="issue-select" id="issueSelectWrap">
            <span class="sr-only">选择期次</span>
            <select id="issueSelect">
              <option value="2026-W30" selected>第二期（7.15-7.22）</option>
              <option value="2026-W29">第一期（7.8-7.15）</option>
            </select>
          </label>
          <button
            class="layout-toggle"
            id="layoutToggle"
            type="button"
            aria-label="切换为瀑布流排列"
            aria-pressed="false"
            title="切换为瀑布流排列"
          >
            <svg class="layout-icon layout-icon-masonry" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="3" width="7" height="8" rx="1.5"></rect>
              <rect x="14" y="3" width="7" height="5" rx="1.5"></rect>
              <rect x="3" y="15" width="7" height="6" rx="1.5"></rect>
              <rect x="14" y="12" width="7" height="9" rx="1.5"></rect>
            </svg>
            <svg class="layout-icon layout-icon-stack" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m12 3 9 5-9 5-9-5 9-5Z"></path>
              <path d="m3 12 9 5 9-5"></path>
              <path d="m3 16 9 5 9-5"></path>
            </svg>
          </button>
        </div>
      </header>

      <section class="stage" aria-label="资源案例">
        <div class="carousel" id="carousel"></div>
      </section>

      <nav class="mode-tabs" aria-label="页面切换">
        <button class="tab-button is-active" type="button" data-mode="featured">本期精选</button>
        <button class="tab-button" type="button" data-mode="all">所有案例</button>
      </nav>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="./app.js?v=8"></script>
  </body>
</html>
